        <h2>Tomato Egg Stir-fry</h2>
        <ul class="ingredient-list">
            <li>2 tomatoes</li>
            <li>3 eggs</li>
            <li>pinch of salt</li>
            <li>some cooking oil</li>
        </ul>
        <ol class="steps">
            <li>Cut tomatoes into pieces.</li>
            <li>Beat eggs and fry them.</li>
