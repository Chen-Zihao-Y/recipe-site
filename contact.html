<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Home Cooking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Home Cooking</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="recipes.html">Recipes</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <button id="theme-toggle">Toggle Dark Mode</button>
        </nav>
    </header>

    <main>
        <h1>Contact</h1>
        <p style="margin-bottom:1.5rem;">If you want to share your recipes, send feedback, or ask questions, feel free to message me!</p>

        <form action="mailto:x20250015@stu.hibiuh.edu.cn" method="GET" style="max-width:600px;">
            <div style="margin-bottom:1rem;">
                <label style="display:block; margin-bottom:0.3rem;">Your Name</label>
                <input type="text" name="name" required style="width:100%; padding:0.6rem; border:1px solid #ccc; border-radius:6px; background:var(--bg-color); color:var(--text-color);">
            </div>
            <div style="margin-bottom:1rem;">
                <label style="display:block; margin-bottom:0.3rem;">Subject</label>
                <input type="text" name="subject" required style="width:100%; padding:0.6rem; border:1px solid #ccc; border-radius:6px; background:var(--bg-color); color:var(--text-color);">
            </div>
            <div style="margin-bottom:1rem;">
                <label style="display:block; margin-bottom:0.3rem;">Your Message</label>
                <textarea name="body" rows="5" required style="width:100%; padding:0.6rem; border:1px solid #ccc; border-radius:6px; background:var(--bg-color); color:var(--text-color);"></textarea>
            </div>
            <button type="submit" style="padding:0.6rem 1.2rem; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">Send Message</button>
        </form>
    </main>

    <footer>
        &copy; 2026 Home Cooking
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
